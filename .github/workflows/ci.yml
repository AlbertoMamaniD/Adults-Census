name: CI/CD Pipeline - Validación de Pruebas

on:
  push:
    branches: [ main, develop, 'feature/**', 'feature/*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    name: Pruebas Unitarias y de Integración (Backend)
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Ejecutar suite de pruebas Backend (29 tests)
        env:
          PYTHONPATH: backend
        run: |
          python -m unittest backend/tests/test_api.py

  test-frontend:
    name: Pruebas Unitarias de Arquitectura (Frontend)
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar suite de pruebas Frontend (16 tests)
        run: |
          node --test frontend/tests/test_state_service.test.js frontend/tests/test_api_service.test.js frontend/tests/test_components.test.js
